<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="200" height="120" viewBox="0 0 200 120">
  <defs>
    <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1" gradientTransform="rotate(20 .5 .5)" spreadMethod="reflect">
      <stop offset="0" stop-color="#f97316"/><stop offset=".5" stop-color="#7c3aed" stop-opacity=".6"/>
    </linearGradient>
    <radialGradient id="rg" cx="30%" cy="30%" r="60%"><stop offset="0" stop-color="white"/><stop offset="1" stop-color="steelblue"/></radialGradient>
    <clipPath id="cp" clipPathUnits="objectBoundingBox"><circle cx=".5" cy=".5" r=".45"/></clipPath>
    <mask id="mk"><rect width="200" height="120" fill="url(#rg)"/></mask>
    <symbol id="star" viewBox="0 0 10 10"><path d="M5 0L6.2 3.6 10 3.6 7 5.9 8.1 9.5 5 7.3 1.9 9.5 3 5.9 0 3.6 3.8 3.6z"/></symbol>
    <pattern id="pt" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="4" height="8" fill="#0a0"/></pattern>
    <filter id="sh" x="-20%" y="-20%" width="160%" height="160%"><feDropShadow dx="2" dy="3" stdDeviation="2" flood-color="#000" flood-opacity=".5"/></filter>
    <marker id="ar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="crimson"/></marker>
  </defs>
  <rect x="5" y="5" width="60" height="50" rx="8" fill="url(#lg)" stroke="#333" stroke-width="2" stroke-dasharray="6 3"/>
  <g clip-path="url(#cp)"><rect x="70" y="5" width="50" height="50" fill="url(#rg)"/></g>
  <use xlink:href="#star" x="125" y="5" width="30" height="30" fill="gold" stroke="black" stroke-width=".3"/>
  <circle cx="175" cy="25" r="18" fill="url(#pt)" stroke="navy" stroke-width="3"/>
  <g opacity=".6"><rect x="5" y="65" width="40" height="40" fill="red"/><rect x="25" y="80" width="40" height="30" fill="blue"/></g>
  <rect x="75" y="65" width="45" height="45" fill="tomato" mask="url(#mk)"/>
  <path d="M130 100 A25 15 30 1 1 180 100" fill="none" stroke="teal" stroke-width="5" stroke-linecap="round" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <polyline points="130,70 145,85 160,70 175,85 190,70" fill="none" stroke="purple" stroke-width="4" stroke-linejoin="round"/>
  <ellipse cx="150" cy="110" rx="12" ry="6" fill="orange" filter="url(#sh)"/>
</svg>
