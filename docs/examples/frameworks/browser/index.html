<!doctype html>
<meta charset="utf-8">
<title>bm-engine Web Worker check</title>
<link rel="icon" href="data:,">
<img id="out" alt="">
<canvas id="canvas" width="600" height="315"></canvas>
<script type="module">
  const worker = new Worker("/render-worker.js", { type: "module" });
  let nextId = 0;
  const pending = new Map();
  worker.onmessage = ({ data: { id, png, error } }) => {
    const p = pending.get(id); pending.delete(id);
    error ? p.reject(new Error(error)) : p.resolve(png);
  };
  const render = (node, options) => new Promise((resolve, reject) => {
    const id = nextId++; pending.set(id, { resolve, reject }); worker.postMessage({ id, node, options });
  });

  const node = { type: "container", style: { display: "flex", width: "100%", height: "100%", alignItems: "center", justifyContent: "center",
    backgroundImage: "linear-gradient(135deg, #f97316, #7c3aed)" },
    children: [{ type: "text", text: "Rendered in a Web Worker", style: { fontFamily: "Inter", fontSize: 32, color: "white" } }] };

  try {
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    const png = await render(node, { width: Math.round(600 * dpr), height: Math.round(315 * dpr), devicePixelRatio: dpr });
    const blob = new Blob([png], { type: "image/png" });
    // 1. as an <img> through a blob URL
    const img = document.getElementById("out");
    img.src = URL.createObjectURL(blob);
    await img.decode();
    img.style.width = "600px";
    // 2. onto a canvas through createImageBitmap
    const bitmap = await createImageBitmap(blob);
    document.getElementById("canvas").getContext("2d").drawImage(bitmap, 0, 0, 600, 315);
    const px = document.getElementById("canvas").getContext("2d").getImageData(5, 5, 1, 1).data;
    document.body.dataset.result = JSON.stringify({ ok: true, natural: [img.naturalWidth, img.naturalHeight], bitmap: [bitmap.width, bitmap.height], dpr, px: [...px] });
  } catch (e) {
    document.body.dataset.result = JSON.stringify({ ok: false, error: String(e) });
  }
</script>
